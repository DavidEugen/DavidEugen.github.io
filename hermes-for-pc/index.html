<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="HermesForPc — Google Workspace CLI 학습용 개인 앱">
    <title>HermesForPc</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M18 17h9v11h10V17h9v30h-9V36H27v11h-9z' fill='white'/%3E%3C/svg%3E">
    <style>
      :root { color-scheme: light; --ink: #14213d; --muted: #52617a; --blue: #2563eb; --line: #dbe4f0; --paper: #fff; --ground: #f4f7fb; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--ground); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; line-height: 1.65; }
      main { width: min(100% - 2rem, 42rem); padding: 1.25rem; }
      .card { padding: clamp(2rem, 7vw, 4.5rem); background: var(--paper); border: 1px solid var(--line); border-radius: 1.25rem; box-shadow: 0 18px 42px rgb(25 54 93 / 9%); }
      .mark { width: 3rem; height: 3rem; display: grid; place-items: center; margin-bottom: 2rem; border-radius: .9rem; background: var(--blue); color: white; font-size: 1.45rem; font-weight: 800; }
      h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.35rem); line-height: 1.12; letter-spacing: -.04em; }
      p { margin: 1.25rem 0 0; font-size: clamp(1rem, 2vw, 1.12rem); color: var(--muted); }
      nav { display: flex; flex-wrap: wrap; gap: 1rem 1.5rem; margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--line); }
      a { color: var(--blue); font-weight: 650; text-underline-offset: .18em; }
      a:hover { color: #1d4ed8; }
      footer { margin-top: 1.25rem; color: var(--muted); font-size: .88rem; text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="app-name">
        <div class="mark" aria-hidden="true">H</div>
        <h1 id="app-name">HermesForPc</h1>
        <p>Google Workspace CLI 학습용 개인 앱</p>
        <nav aria-label="정책 문서">
          <a href="privacy.html">개인정보처리방침</a>
          <a href="term.html">서비스 약관</a>
        </nav>
      </section>
      <footer>© 2026 HermesForPc</footer>
    </main>
  </body>
</html>
